name: Generate Profile Cards

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate summary cards (stats + top languages)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: a23cliferand
          BRANCH_NAME: main
          THEME: github_dark

      - name: Snapshot trophies
        run: |
          mkdir -p profile-trophy-output
          curl -sL "https://github-profile-trophy.vercel.app/?username=a23cliferand&theme=radical&no-frame=true&margin-w=8" -o profile-trophy-output/trophies.svg

      - name: Commit trophies snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-trophy-output
          git diff --cached --quiet || git commit -m "Update trophies snapshot"
          git pull --rebase
          git push
